name: HYROX Ticket Monitor

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # GitHub schedules use UTC. These approximate 7:17 AM-11:17 PM Toronto
    # during daylight time, which covers the October 2026 event window.
    - cron: "17 11-23 * * *"
    - cron: "17 0-3 * * *"

concurrency:
  group: hyrox-ticket-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare state directory
        run: mkdir -p .monitor-cache

      - name: Restore monitor state
        uses: actions/cache@v4
        with:
          path: .monitor-cache
          key: hyrox-ticket-state-${{ github.run_id }}
          restore-keys: |
            hyrox-ticket-state-

      - name: Send Discord smoke test
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[discord-test]')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ENABLED: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        run: npm run notify-test

      - name: Run monitor
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[discord-test]')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ENABLED: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
          HYROX_STATE_FILE: .monitor-cache/monitor.state.json
          HYROX_LOG_FILE: .monitor-cache/monitor.log
          HYROX_ERROR_NOTIFIED_FILE: .monitor-cache/error-notified
        run: npm run check:now

      - name: Notify workflow failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -f .monitor-cache/error-notified ]; then
            echo "Monitor script already sent a Discord error notification."
            exit 0
          fi

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "No Discord webhook secret configured; skipping failure notification."
            exit 0
          fi

          MESSAGE="HYROX ticket monitor workflow failed outside the monitor script.
GitHub run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          export MESSAGE

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -d "$(node -e 'process.stdout.write(JSON.stringify({ content: process.env.MESSAGE }))')" \
            "$DISCORD_WEBHOOK_URL"

      - name: Upload monitor diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-diagnostics
          path: .monitor-cache
          if-no-files-found: ignore
