name: HYROX Ticket Monitor

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # GitHub schedules use UTC. These approximate 7:17 AM-11:17 PM Toronto
    # during daylight time, which covers the October 2026 event window.
    - cron: "17 11-23 * * *"
    - cron: "17 0-3 * * *"

concurrency:
  group: hyrox-ticket-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare state directory
        run: mkdir -p .monitor-cache

      - name: Restore monitor state
        uses: actions/cache@v4
        with:
          path: .monitor-cache
          key: hyrox-ticket-state-${{ github.run_id }}
          restore-keys: |
            hyrox-ticket-state-

      - name: Send Discord smoke test
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[discord-test]')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ENABLED: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        run: npm run notify-test

      - name: Run monitor
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[discord-test]')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ENABLED: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
          HYROX_STATE_FILE: .monitor-cache/monitor.state.json
          HYROX_LOG_FILE: .monitor-cache/monitor.log
          HYROX_ERROR_NOTIFIED_FILE: .monitor-cache/error-notified
        run: npm run check:now

      - name: Notify workflow failure
        if: failure()
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const fs = require("fs");

            if (fs.existsSync(".monitor-cache/error-notified")) {
              core.info("Monitor script already sent a Discord error notification.");
              return;
            }

            const webhookUrl = process.env.DISCORD_WEBHOOK_URL;
            if (!webhookUrl) {
              core.info("No Discord webhook secret configured; skipping failure notification.");
              return;
            }

            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const response = await fetch(webhookUrl, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                content: [
                  "HYROX ticket monitor workflow failed outside the monitor script.",
                  `GitHub run: ${runUrl}`
                ].join("\n")
              })
            });

            if (!response.ok) {
              throw new Error(`Discord webhook failed: HTTP ${response.status} ${await response.text()}`);
            }

      - name: Upload monitor diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-diagnostics
          path: .monitor-cache
          if-no-files-found: ignore
