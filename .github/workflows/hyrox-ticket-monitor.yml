name: HYROX Ticket Monitor

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC. These approximate 7:17 AM-11:17 PM Toronto
    # during daylight time, which covers the October 2026 event window.
    - cron: "17 11-23 * * *"
    - cron: "17 0-3 * * *"

concurrency:
  group: hyrox-ticket-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare state directory
        run: mkdir -p .monitor-cache

      - name: Restore monitor state
        uses: actions/cache@v4
        with:
          path: .monitor-cache
          key: hyrox-ticket-state-${{ github.run_id }}
          restore-keys: |
            hyrox-ticket-state-

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ENABLED: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
          HYROX_STATE_FILE: .monitor-cache/monitor.state.json
        run: npm run check:now
